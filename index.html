<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Speech Remastering — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#1f2328; --ink2:#3d444d; --muted:#6a737d; --faint:#8c959f;
  --line:#e6e8eb; --line2:#d0d7de; --soft:#f6f8fa;
  /* NAVER green: interaction state only (selected, playing, links) */
  --brand:#03c75a; --brand-dk:#0a7c3e; --brand-bg:#eaf9f0; --brand-bd:#8fe0b1;
  /* element pastels: bg / border / text */
  --M-bg:#e5e8fb; --M-bd:#b8c1f0; --M-fg:#34438f;
  --I-bg:#efe7f9; --I-bd:#d2bff0; --I-fg:#5b3d8a;
  --N-bg:#f7eedd; --N-bd:#e6cfa3; --N-fg:#765626;
  --E-bg:#fbe6e3; --E-bd:#f0c0b8; --E-fg:#8a3b33;
  --R-bg:#dcf1f7; --R-bd:#9dd4e2; --R-fg:#1f6272;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
@media (max-width:600px){.wrap{padding:0 16px}}
h1,h2,h3{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.015em}

/* header */
header{padding:72px 0 36px;text-align:center}
header h1{font-size:clamp(28px,4vw,40px)}
header .sub{font-size:clamp(16px,2vw,19px);color:var(--muted);margin-top:8px}
header .authors{margin-top:22px}
header .aff{color:var(--muted);font-size:14px}
header .authors .au{white-space:nowrap}
header .authors sup,header .aff sup{font-size:.68em;margin-left:1px;line-height:0}
header .affs{margin-top:4px;line-height:1.55}
header .affs .af{display:block}
header .notes{margin-top:12px;color:var(--faint);font-size:12.5px}
header .notes .af{display:inline-block}
header .notes .af + .af{margin-left:16px}
.abstract .terms{margin-top:12px;font-size:13.5px;color:var(--muted)}
.abstract .terms b{color:var(--ink2);font-weight:600}
header .btns{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
header .btns a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:999px;border:1px solid var(--brand-bd);background:var(--brand-bg);color:var(--brand-dk);font-weight:600;font-size:14.5px;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
header .btns a:hover{background:var(--brand);border-color:var(--brand);color:#fff}
header .btns .ic{font-size:16px;line-height:1}
.abstract{max-width:760px;margin:40px auto 0;text-align:left}
.abstract h2,.guide h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.abstract p{margin:0;color:var(--ink2)}
section.guide{padding:40px 0 0}
.guide .box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.guide .pane{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:22px 26px}
@media (max-width:820px){.guide .box{grid-template-columns:1fr}.guide .pane{padding:18px 20px}}
.guide h3{font-size:16px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.guide ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.guide li{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:baseline;font-size:14px;color:var(--ink2)}
.guide li .dotc{position:relative;top:1px}
.guide li b{color:var(--ink);font-weight:600}
.guide ol{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
.guide ol li{grid-template-columns:24px 1fr;counter-increment:st}
.guide ol li::before{content:counter(st);width:22px;height:22px;border-radius:50%;background:var(--brand-bg);border:1px solid var(--brand-bd);color:var(--brand-dk);font-size:12px;font-weight:700;display:grid;place-items:center}
kbd{font:600 11px ui-monospace,Menlo,monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff;color:var(--ink)}
.el{display:inline-flex;align-items:center;gap:6px}
.dotc{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--c-bd) 55%,var(--c-fg));display:inline-block;flex:none}

/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{position:relative;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;padding:14px 0 12px;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-color:var(--brand)}

/* sections */
section{padding:56px 0 8px}
.sec-head h2{font-size:26px}
.sec-head .desc{margin:8px 0 0;color:var(--ink2);max-width:760px}
.sec-head .verbs{margin:6px 0 0;color:var(--muted);font-size:13.5px}

/* sample block */
.sample{border-top:1px solid var(--line);padding:26px 0 30px;margin-top:22px}
.s-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.s-head .idx{font-weight:600;color:var(--ink);font-size:14px}
.s-head .has{display:inline-flex;gap:14px;flex-wrap:wrap}
.opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.opts .lb{font-size:13px;color:var(--muted);min-width:68px}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.pill:hover{border-color:var(--brand-bd)}
.pill .dotc{width:10px;height:10px}
.pill .ck{display:none;color:var(--brand-dk);font-weight:700;font-size:12px;margin-right:-2px}
.pill.on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand-dk);font-weight:600;box-shadow:0 0 0 1px var(--brand) inset}
.pill.on .ck{display:inline}
.pill.absent{border-style:dashed;color:var(--faint)}
.pill.absent .dotc{background:transparent;border:1.5px dashed var(--c-bd)}
.pill.absent.on{background:var(--soft);border-color:var(--brand-bd);color:var(--muted);box-shadow:none}
.pill .x{font-size:11.5px;opacity:.85;font-weight:400}
.pill.fixed{cursor:default}
.pill.locked{opacity:.38;cursor:not-allowed;border-style:solid}
.pill.locked:hover{border-color:var(--line2);color:var(--ink2)}
.lockhint{margin:8px 0 0;font-size:12.5px;color:var(--faint)}
.opts .none{font-size:13.5px;color:var(--muted)}
.prompt{font-size:21px;font-weight:500;margin:16px 0 0;line-height:1.45;letter-spacing:-.01em}
.prompt .q{color:var(--faint);font-weight:400}
.prompt .verb{font-weight:700}
.prompt .np{background:var(--c-bg);color:var(--c-fg);border-radius:5px;padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.prompt .np.S{background:linear-gradient(90deg,var(--M-bg),var(--I-bg));color:var(--M-fg)}
.notice{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.notice b{color:var(--ink2);font-weight:600}
.s-note{margin:8px 0 0;font-size:13.5px;color:var(--muted)}

/* three columns */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.cols.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.cols.two{grid-template-columns:1fr}}
@media (max-width:760px){.cols{grid-template-columns:1fr;gap:12px}}
.col-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pb{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--ink);background:#fff;transition:background .15s,border-color .15s}
.pb:hover{border-color:var(--brand)}
.pb svg{width:11px;height:11px;fill:currentColor;pointer-events:none}
.col.playing .pb{background:var(--brand);border-color:var(--brand);color:#fff}
.col-lb{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.col.playing .col-lb{color:var(--ink)}
.col-t{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.spec{position:relative;height:116px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:border-color .15s}
.col.playing .spec{border-color:var(--brand)}
.spec canvas{position:absolute;inset:0;width:100%;height:100%}
.spec .head{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.7);opacity:0;pointer-events:none}
/* axes: frequency on the left (linear, 0–22.05 kHz), time below (each file's own length); faint grid inside */
.plot{display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto 15px}
.ax-y{position:relative;font-size:9.5px;line-height:1;color:var(--faint);font-variant-numeric:tabular-nums}
.ax-y span{position:absolute;right:6px;transform:translateY(50%);white-space:nowrap}
.ax-y span::after{content:"";position:absolute;right:-6px;top:50%;width:3px;border-top:1px solid var(--line2)}
.ax-y span.lo::after{top:auto;bottom:0}
.ax-y span.hi::after{top:0}
.ax-y span.lo{transform:none}
.ax-y span.hi{transform:translateY(calc(100% + 2px))}
.plot.compact .ax-y span.mid:not(.keep){display:none}
.ax-x{grid-column:2;position:relative;font-size:9.5px;line-height:1;color:var(--faint);font-variant-numeric:tabular-nums}
.ax-x span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.ax-x span.lo{transform:none}
.ax-x span::before{content:"";position:absolute;left:50%;top:-4px;height:3px;border-left:1px solid var(--line2)}
.ax-x span.lo::before{left:0}
.spec .grid{position:absolute;inset:0;pointer-events:none}
.spec .grid i{position:absolute;display:block}
.spec .grid .gh{left:0;right:0;border-top:1px solid rgba(255,255,255,.13)}
.spec .grid .gv{position:absolute;inset:0}
.spec .grid .gx{top:0;bottom:0;border-left:1px solid rgba(255,255,255,.10)}
.spec .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12px;color:var(--faint);font-size:12px;pointer-events:none;background:var(--soft)}
.spec .mark{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.6);pointer-events:none}
.spec .mark span{position:absolute;top:4px;left:4px;font-size:10.5px;color:var(--ink2);background:rgba(255,255,255,.85);padding:0 4px;border-radius:3px;white-space:nowrap}

/* real-world: video on the left, one row per version on the right (play + prompt + spectrogram),
   the right column stretched to the video's height; stacks on narrow screens */
.rw{border-top:1px solid var(--line);padding:26px 0 30px;margin-top:22px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);grid-template-areas:"title title" "video tracks";gap:0 24px;align-items:stretch}
.rw .rw-title{grid-area:title;margin-bottom:14px}
.rw h3{font-size:17px}
.rw .src{font-size:13px;color:var(--muted);margin:2px 0 0}
.vbox{grid-area:video;align-self:center;position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9}
.vbox video{width:100%;height:100%;display:block;object-fit:contain}
.vbox .msg{position:absolute;inset:0;display:grid;place-items:center;color:#9aa1a9;font-size:12.5px;text-align:center;padding:0 16px;pointer-events:none}
.trks{grid-area:tracks;display:flex;flex-direction:column;gap:14px;min-height:0}
.trk{flex:1 1 auto;display:flex;flex-direction:column}
.trk-head{display:flex;align-items:center;gap:6px 10px;margin-bottom:8px;flex-wrap:wrap}
.trk-head .pb{width:28px;height:28px}
.trk-head .prompt{font-size:14px;margin:0;flex-basis:100%;order:3;line-height:1.35}
.trk-head .asrec{font-size:13px;color:var(--faint)}
.trk .plot{flex:1 1 auto;grid-template-rows:minmax(46px,1fr) 15px}
.trk .spec{height:auto}
.trk.on .spec{border-color:var(--brand)}
.trk.on .col-lb{color:var(--ink)}
.trk.playing .pb{background:var(--brand);border-color:var(--brand);color:#fff}
@media (max-width:860px){.vbox{position:sticky;top:44px;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.12)}.rw{grid-template-columns:1fr;grid-template-areas:"title" "video" "tracks";gap:0}.trks{margin-top:16px;gap:16px}.trk{flex:none}.trk .plot{flex:none;grid-template-rows:84px 15px}}

footer{padding:56px 0 72px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:56px}
footer h3{font-size:15px;color:var(--ink);margin-bottom:10px}
pre.bib{background:var(--soft);border-radius:8px;padding:14px 16px;overflow-x:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink2);margin:0}
#check{position:fixed;right:12px;bottom:12px;max-width:min(520px,calc(100vw - 24px));max-height:50vh;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font:12px/1.5 ui-monospace,Menlo,monospace;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.12)}

/* ---------- phones ---------- */
@media (max-width:600px){
  header{padding:44px 0 24px}
  header .authors{margin-top:16px;font-size:14.5px}
  header .aff,header .notes{font-size:12.5px}
  header .btns{margin-top:16px}
  header .btns a{height:36px;padding:0 16px;font-size:14px}
  .abstract{margin-top:28px}
  .abstract p{font-size:15px}
  nav .wrap{gap:18px}
  nav a{font-size:13.5px;padding:12px 0 10px}
  section{padding:40px 0 4px}
  section.guide{padding-top:28px}
  .guide .pane{padding:16px}
  .guide h3{font-size:15px}
  .sec-head h2{font-size:22px}
  .sec-head .desc{font-size:14.5px}
  .sample{padding:20px 0 22px;margin-top:16px}
  .s-head{gap:6px 12px}
  .s-head .has{gap:4px 12px}
  .opts{gap:6px;margin-top:14px}
  .opts .lb{min-width:0;margin-right:2px}
  .pill{height:32px;padding:0 12px 0 10px;font-size:13px}
  .prompt{font-size:18px;margin-top:14px}
  .cols{gap:14px;margin-top:14px}
  .col-head{margin-bottom:6px}
  .spec{height:92px}
  .plot{grid-template-columns:30px minmax(0,1fr)}
  .ax-y,.ax-x{font-size:9px}
  .rw{padding:20px 0 24px;margin-top:16px}
  .trk-head .prompt{font-size:14px}
  footer{padding:40px 0 56px}
  pre.bib{font-size:11px;padding:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
 * 1. MANIFEST — the only part you need to edit.
 *
 * Path convention (override per sample with inputSrc / outputs:{Tnn:src} / targets:{Tnn:src}):
 *   audio/sim/<scene>/input.wav
 *   audio/sim/<scene>/output_<Tnn>.wav
 *   audio/sim/<scene>/target_<Tnn>.wav     (not needed for a no-op: target = input)
 *   audio/real/<id>/<id>_video.mp4         (muted video, e.g. test00114/test00114_video.mp4)
 *   audio/real/<id>/input.wav              (original audio of the clip)
 *   audio/real/<id>/output_<Tnn>.wav       (SRM output for outputs:[{task:"Tnn"}])
 *   realworld outputs: {task:"T01"} → output_T01.wav, prompt defaults to the canonical one;
 *                      add prompt:"..." for the exact wording, or src:"..." for any other file name
 *
 * scene.elements : letters in the scene (M is implied)
 *                  M main speaker · I interfering speaker · N background noise
 *                  E sound event  · R reverberation
 * scene.event    : caption of the sound event, used in the prompt and the option label
 * scene.marks    : optional [{t: seconds, label}] shown on the spectrograms
 *
 * section sample : { scene, select:[...], prompts:{Tnn:"..."}, tasks:[...], note }
 *   select   default element selection (e.g. ["N","R"] for remove)
 *   prompts  exact prompt used at inference per task (else a canonical one)
 *   tasks    optional list of rendered tasks; other combinations say "not rendered"
 * ===================================================================== */
const DEMO = {
  meta: {
    title: "Speech Remastering",
    subtitle: "Prompt-driven revision of a recorded speaking scene",
    /* aff = 1-based index into affiliations; corr:true adds corrMark; sym adds an extra footnote mark */
    authors: [
      {name:"Myungjin Lee",   aff:[1,2], sym:"*"},
      {name:"Youna Ji",       aff:[1]},
      {name:"Jiyoung Lee",    aff:[2]},
      {name:"Min-Seok Choi",  aff:[1], corr:true},
      {name:"Soo-Whan Chung", aff:[1], corr:true},
    ],
    affiliations: [
      "Naver Cloud Corporation, South Korea",
      "Division of Artificial Intelligence & Software, Ewha Womans University, South Korea",
    ],
    corrMark: "†",
    footnotes: [ {sym:"*", text:"Work done during internship at Naver Cloud"}, {sym:"†", text:"Corresponding authors"} ],
    venue: "",   // e.g. "Accepted to ICASSP 2027" — empty hides the line
    links: [ {label:"Paper", icon:"📄", href:"#"}, {label:"Code", icon:"💻", href:"#"} ],
    intro: "We propose a novel speech processing task, speech remastering, which revises the acoustic elements of a recorded speaking scene under the control of a text prompt. A recording of such a scene captures not only the speech but also various other acoustic elements. Conventional speech enhancement aims to recover the speech in its clean form and remove everything else. However, which elements a user wants to keep or remove differs from case to case. Speech remastering instead lets the prompt specify which operation is applied to which elements, rather than acting on the same elements in every recording. We implement the task with a single prompt-conditioned model. Experiments show that the model follows prompted operations, including requests beyond a fixed enhancement target, while leaving untargeted elements intact.",
    indexTerms: "Speech remastering, speech enhancement, speaking scene, prompt-based speech processing",
    bibtex: "@inproceedings{srm2027,\n  title     = {TBD},\n  author    = {Lee, Myungjin and Ji, Youna and Lee, Jiyoung and Choi, Min-Seok and Chung, Soo-Whan},\n  booktitle = {TBD},\n  year      = {2027}\n}",
  },
  root: "audio/",
  showTarget: true,    // true → simulated samples show Input | Output | Target (target_<Tnn>.wav needed); false → Input | Output

  /* One entry per recording. The key is the folder name under audio/sim/.
   * elements: letters in the recording (M main · I interferer · N noise · E event · R reverb)
   * event   : sound-event caption used in the prompt ("dog barking", "applauding sound", …) */
  scenes: {
    rm1: { elements:"MINER", event:"the sound of explosion" },
    rm2: { elements:"MINER", event:"coin dropping sound" },
    /*rm3: { elements:"MINR", event:"none" },*/

    rd1: { elements:"MNR" },
    rd2: { elements:"MIR" },

    en1: { elements:"MNER", event:"…" },
    en2: { elements:"MNR" },
    en3: { elements:"MINER", event:"…" },

    bo1: { elements:"MIN" },
    bo2: { elements:"MIR" },
    bo3: { elements:"MINE", event:"…" },

    nm1: { elements:"MIN" },
    nm2: { elements:"MIR" },

    hero:{ elements:"MINER", event:"dog barking" },   // hidden 21-prompt section (hero.show:false)
  },

  /* Order in each list = Sample 1, 2, 3 on the page. */
  sections: {
    remove:    [ {scene:"rm1", select:["N","R"]},
                 {scene:"rm2", select:["I"]}
                  ],
    reduce:    [ {scene:"rd1"}, {scene:"rd2"} ],
    enhance:   [ {scene:"en1"}, {scene:"en2"}, {scene:"en3"} ],
    boost:     [ {scene:"bo1", select:["M"]}, {scene:"bo2", select:["I"]}, {scene:"bo3", select:["M","I"]} ],
    normalize: [ {scene:"nm1"}, {scene:"nm2"} ],
  },

  /* One scene rendered with all 21 prompts. Kept for later — set show:true once such a recording is ready. */
  hero: { show:false, scene:"hero", prompts:{} },

  realworld: [
    { id:"rw04", title:"Sample 1", source:"Source: AudioCaps",
      video:"test00000_video.mp4", event:"the applauding sound",
      outputs:[ {task:"T01"}, {task:"T04"} ] },
    { id:"rw05", title:"Sample 2", source:"Source: AudioCaps",
      video:"test00302_video.mp4",
      outputs:[ {task:"T16"}, {task:"T18"} ] },
  ],
};

/* =====================================================================
 * 2. TASK DEFINITIONS (fixed; paper Table 1 / release T01–T21)
 * ===================================================================== */
const ELS = ["M","I","N","E","R"];
const EL_NAME  = {M:"Main speaker", I:"Interfering speaker", N:"Background noise", E:"Sound event", R:"Reverberation"};
const EL_SHORT = {M:"Main speaker", I:"Interferer", N:"Noise", E:"Sound event", R:"Reverb"};
const TASKS = {
  T01:{op:"remove",els:["N"]}, T02:{op:"remove",els:["E"]}, T03:{op:"remove",els:["I"]}, T04:{op:"remove",els:["R"]},
  T05:{op:"remove",els:["N","E"]}, T06:{op:"remove",els:["I","N"]}, T07:{op:"remove",els:["N","R"]},

const VERB_RE = /\b(get rid of|strip out|raise the volume of|increase the volume of|turn up the volume of|match the volume of|remove|erase|eliminate|delete|reduce|dampen|mitigate|attenuate|enhance|clean(?: up)?|amplify|boost|make|louder|normalize|balance)\b/i;

  const pats = [
    [/\b(interfering (?:speaker|speech)|other speaker|second speaker|background speaker)\b/i, "I"],
    [/\b(main (?:speaker|speech)|target speaker)\b/i, "M"],
    [/\b(all (?:the )?speakers|speakers|speech|voices)\b/i, "S"],

function promptNode(text, scene){
  const pats = [[VERB_RE,"verb"], ...nounPatterns(scene)];
  const out = h("p",{class:"prompt"}, h("span",{class:"q"},"“"));
  let i = 0;
  while (i < text.length){
    let best = null;
    for (const [re,cls] of pats){
      const m = re.exec(text.slice(i));
      if (m && (!best || m.index<best.idx || (m.index===best.idx && m[0].length>best.len))) best = {idx:m.index, len:m[0].length, cls};

    if (!best){ out.append(text.slice(i)); break; }

/* Frequency axis: 0 – 22.05 kHz (linear) for every file.

/* Engine: every version plays in sync and only the audible one has gain 1,

/* Three-column view: Input | Output | Target, each with its own play button, one shared clock */
class ColumnsView {
  constructor(engine, labels, marks){
    this.engine = engine; this.marks = marks; this.cols = {};

    for (const [key,label] of labels){
      const pb = h("button",{class:"pb","aria-label":"Play "+label, html:ICON_PLAY, onclick:()=>{ Engine.last=engine; engine.toggle(key); }});
      const t = h("span",{class:"col-t"},"");

      spec.addEventListener("pointerdown", e => { Engine.last=engine; spec.setPointerCapture(e.pointerId); this._drag=true; seek(e); });
      spec.addEventListener("pointermove", e => { if (this._drag) seek(e); });

      const col = h("div",{class:"col"}, h("div",{class:"col-head"}, pb, h("span",{class:"col-lb"},label), t), plot.el);

  async loaded(slots, bufs, dur, alive){

      const c = this.cols[s.key]; if (!c) return;
      const sp = bufs[s.key] ? await getSpec(s.src) : null;
      if (!alive()) return;
      const g = c.cv.getContext("2d"); g.clearRect(0,0,SPEC_W,SPEC_H); if (sp) g.drawImage(sp,0,0);
      c.msg.hidden = !!sp;

      setTimeAxis(c.x, bufs[s.key] ? bufs[s.key].duration : 0);
      c.spec.querySelectorAll(".mark").forEach(m=>m.remove());

      const d = e.bufs[k] ? e.bufs[k].duration : e.dur;

      if (show) c.head.style.left = Math.min(100, p/d*100)+"%";

  if (/INPUT|TEXTAREA|SELECT|VIDEO/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName==="BUTTON" && (e.code==="Space" || e.code==="Enter")) return;   // the button's own click handles it
  const en = Engine.last; if (!en) return;
  if (e.code==="Space"){ e.preventDefault(); en.toggle(); }
  else if (/^[1-9]$/.test(e.key)){ const s = en.slots[+e.key-1]; if (s) en.playing ? en.select(s.key) : en.play(s.key); en.onkey && en.onkey(s && s.key); }
});

/* =====================================================================
 * 5. PAGE
 * ===================================================================== */
const SIM_COLS = () => DEMO.showTarget ? [["input","Input"],["output","Output"],["target","Target"]] : [["input","Input"],["output","Output"]];
const simSlots = (inp, out, tgt) => DEMO.showTarget ? [{key:"input",src:inp},{key:"output",src:out},{key:"target",src:tgt}] : [{key:"input",src:inp},{key:"output",src:out}];

function sampleBlock(op, sm, index){
  const O = OPS[op], scene = sceneOf(sm.scene), p = present(scene);
  let sel = new Set(sm.select || (O.opts.length ? [O.opts.find(e=>p.has(e)) || O.opts[0]] : []));
  if (!O.multi && O.opts.length) sel = new Set([O.opts[0]]);
  // Training contract: when a recording holds both background noise and a sound event, noise is
  // only removed together with the event (T01/T06/T07/T13 are undefined there). Noise stays locked
  // until the event is selected.
  const lockNE = op==="remove" && p.has("N") && p.has("E");
  if (lockNE && sel.has("N") && !sel.has("E")) sel.add("E");

  const engine = new Engine();
  const view = new ColumnsView(engine, SIM_COLS(), scene.marks);
  engine.view = view;

  const promptBox = h("div"), notice = h("p",{class:"notice",hidden:true});
  const pills = {};
  const optsRow = O.opts.length
    ? h("div",{class:"opts"}, h("span",{class:"lb"}, O.multi ? "Select" : "Element"),
        O.opts.map(e => pills[e] = h("button",{class:"pill"+(p.has(e)?"":" absent")+(O.multi?"":" fixed"), style:cvars(e),
          title: p.has(e) ? EL_NAME[e] : EL_NAME[e]+" — not in this recording",
          onclick: () => { if (!O.multi) return;
            if (lockNE && e==="N" && !sel.has("E")) return;            // locked until the event is chosen
            sel.has(e) ? sel.delete(e) : sel.add(e);
            if (lockNE && e==="E" && !sel.has("E")) sel.delete("N");   // dropping the event drops noise too
            if (!sel.size) sel.add(e);
            update(); }},
          h("span",{class:"ck"},"✓"), h("i",{class:"dotc"}), elLabel(e, scene), p.has(e) ? null : h("span",{class:"x"},"· not in recording"))))
    : h("div",{class:"opts"}, h("span",{class:"lb"},"Element"), h("span",{class:"none"},"none — the prompt states a goal instead of naming elements"));

  const lockHint = lockNE ? h("p",{class:"lockhint",hidden:true}, `Noise can be removed together with the ${elLabel("E",scene).toLowerCase()} — select it first.`) : null;
  const block = h("article",{class:"sample", id:`${op}-${sm.scene}`});
  function update(){
    const task = taskFor(op, sel), t = TASKS[task];
    for (const [e,b] of Object.entries(pills)) b.classList.toggle("on", sel.has(e));
    if (lockNE){ const locked = !sel.has("E"); pills.N.classList.toggle("locked", locked); pills.N.setAttribute("aria-disabled", locked);
      pills.N.title = locked ? `Select the ${elLabel("E",scene).toLowerCase()} first — noise is removed together with it` : EL_NAME.N;
      lockHint.hidden = !locked; }
    promptBox.replaceChildren(promptNode((sm.prompts||{})[task] || canonicalPrompt(task, scene), scene));
    const missing = t.els.filter(e => !p.has(e));
    const noop = missing.length === t.els.length;
    const names = joinList(missing.map(e => elLabel(e,scene).toLowerCase()));
    if (noop){
      notice.hidden = false;
      notice.replaceChildren(h("b",{},"No-op. "), t.op==="enhance" ? "There is nothing to remove in this recording" : `The ${names} ${missing.length>1?"are":"is"} not in this recording`, ", so the output should equal the input.");
    } else if (missing.length && t.op!=="enhance"){
      notice.hidden = false;
      notice.replaceChildren(`The ${names} ${missing.length>1?"are":"is"} not in this recording — that part of the prompt should leave the audio unchanged.`);
    } else notice.hidden = true;
    const rendered = !sm.tasks || sm.tasks.includes(task);
    const inp = sm.inputSrc || P.input(sm.scene);
    const out = rendered ? ((sm.outputs||{})[task] || P.output(sm.scene, task)) : null;
    const tgt = noop ? inp : rendered ? ((sm.targets||{})[task] || P.target(sm.scene, task)) : null;
    block.dataset.task = task;
    engine.setSlots(simSlots(inp, out, tgt));
  }

  const has = [...p].sort((a,b)=>ELS.indexOf(a)-ELS.indexOf(b)).map(e => h("span",{class:"el",style:cvars(e)}, h("i",{class:"dotc"}), elLabel(e, scene)));
  block.append(
    h("div",{class:"s-head"}, h("span",{class:"idx"}, "Sample "+(index+1)), h("span",{class:"has"}, has)),
    ...[optsRow, lockHint, promptBox, notice, sm.note ? h("p",{class:"s-note"}, sm.note) : null, view.el].filter(Boolean));
  update();
  return block;
}

function opSection(op){
  const O = OPS[op], list = DEMO.sections[op] || [];
  return h("section",{id:op}, h("div",{class:"wrap"},
    h("div",{class:"sec-head"}, h("h2",{}, O.label), h("p",{class:"desc"}, O.desc),
      h("p",{class:"verbs"}, "Verbs: " + O.verbs.join(", "))),
    list.map((sm,i) => sampleBlock(op, sm, i))));
}

/* ---- kept for later: one recording with all 21 prompts (DEMO.hero.show) ---- */
function heroSection(){
  const H = DEMO.hero, scene = sceneOf(H.scene), p = present(scene);
  const engine = new Engine();
  const view = new ColumnsView(engine, SIM_COLS(), scene.marks);
  engine.view = view;
  let op = "remove", sel = new Set(["I","N","E","R"].filter(e=>p.has(e)));
  const promptBox = h("div"), pills = [];
  const groups = [["remove",["I","N","E","R"],true], ["reduce",["R"],false], ["enhance",[],false], ["boost",["M","I"],true], ["normalize",["I"],false]];
  const rows = groups.map(([g, els, multi]) => h("div",{class:"opts"}, h("span",{class:"lb"}, OPS[g].label),
    (els.length ? els : ["_"]).map(e => { const b = h("button",{class:"pill", style:e==="_"?null:cvars(e), onclick:()=>{
        if (op!==g){ op=g; sel=new Set(e==="_"?[]:[e]); } else if (multi){ sel.has(e)?sel.delete(e):sel.add(e); if (!sel.size) sel.add(e); }
        update(); }}, h("span",{class:"ck"},"✓"), e==="_" ? null : h("i",{class:"dotc"}), e==="_" ? "the speech" : elLabel(e, scene)); pills.push([g,e,b]); return b; })));
  function update(){
    const task = taskFor(op, sel);
    pills.forEach(([g,e,b]) => b.classList.toggle("on", g===op && (e==="_" || sel.has(e))));
    promptBox.replaceChildren(promptNode((H.prompts||{})[task] || canonicalPrompt(task, scene), scene));
    engine.setSlots(simSlots(P.input(H.scene), P.output(H.scene,task), P.target(H.scene,task)));
  }
  const block = h("article",{class:"sample"}, ...rows, promptBox, view.el);
  update();
  return h("section",{id:"all21"}, h("div",{class:"wrap"},
    h("div",{class:"sec-head"}, h("h2",{},"One recording, 21 prompts"),
      h("p",{class:"desc"},"A single recording that contains every element, edited by each of the 21 prompts.")), block));
}

/* ---- real-world clips: the muted video is the clock; every version gets its own
 *      spectrogram row under the video, on the same time axis, with one shared playhead ---- */
class TracksView {
  constructor(engine, video, slots, onPick){
    this.engine = engine; this.video = video; this.rows = {};
    this.el = h("div",{class:"trks"});
    for (const s of slots){
      const pb = h("button",{class:"pb","aria-label":"Play "+s.label, html:ICON_PLAY, onclick:()=>onPick(s.key, true)});
      const t = h("span",{class:"col-t"},"");
      const cv = h("canvas",{width:SPEC_W,height:SPEC_H}), head = h("div",{class:"head"}), msg = h("div",{class:"msg"},"");
      const spec = h("div",{class:"spec"}, cv, head, msg);
      spec.addEventListener("pointerdown", e => { const r = spec.getBoundingClientRect();
        if (video.duration) video.currentTime = Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*video.duration;
        onPick(s.key, false); });
      const plot = framePlot(spec);
      const row = h("div",{class:"trk"},
        h("div",{class:"trk-head"}, pb, h("span",{class:"col-lb"}, s.label),
          s.prompt ? null : h("span",{class:"asrec"},"· as recorded"), t, s.prompt ? promptNode(s.prompt, {event: s.event}) : null),
        plot.el);
      this.rows[s.key] = {row, pb, t, cv, head, msg, src:s.src, x: plot.x};
      this.el.append(row);
    }
  }
  loading(){ for (const r of Object.values(this.rows)){ r.msg.hidden=false; r.msg.textContent="loading…"; } }
  async loaded(slots, bufs, dur, alive){
    await Promise.all(slots.map(async s => {
      const r = this.rows[s.key]; if (!r) return;
      const sp = bufs[s.key] ? await getSpec(s.src) : null; if (!alive()) return;
      const g = r.cv.getContext("2d"); g.clearRect(0,0,SPEC_W,SPEC_H); if (sp) g.drawImage(sp,0,0);
      r.msg.hidden = !!sp; r.msg.textContent = sp ? "" : whyMissing(s.src);
      setTimeAxis(r.x, bufs[s.key] ? bufs[s.key].duration : 0);
    }));
  }
  render(){
    const e = this.engine, v = this.video, d = v.duration || e.dur, playing = !v.paused;
    for (const [k,r] of Object.entries(this.rows)){
      const on = k===e.active;
      r.row.classList.toggle("on", on);
      r.row.classList.toggle("playing", on && playing);
      setIcon(r.pb, on && playing);
      const fd = e.bufs[k] ? e.bufs[k].duration : d;
      const show = on && (playing || v.currentTime>0) && fd;
      r.head.style.opacity = show ? 1 : 0;
      if (show) r.head.style.left = Math.min(100, v.currentTime/fd*100)+"%";
      r.t.textContent = e.dur ? (on && v.currentTime>0 ? fmt(v.currentTime)+" / " : "") + fmt(e.dur) : "";
    }
  }
}
function realBlock(rw){
  const base = `${DEMO.root}real/${rw.id}/`;
  const many = rw.outputs.length > 1;
  const inFolderA = f => f && !f.includes("/") ? base + f : f;
  const slots = [{key:"input", label:"Input", src: inFolderA(rw.input) || base+"input.wav"},
    ...rw.outputs.map(o => ({...o, task: o.task ? o.task.replace(/^T(\d)$/i, "T0$1").toUpperCase() : o.task}))
      .map((o,i) => ({key:"out"+i, label: many ? `Output ${i+1}` : "Output",
      src: inFolderA(o.src) || (o.task ? `${base}output_${o.task}.wav` : `${base}out_${i+1}.wav`),
      prompt: o.prompt || (o.task ? canonicalPrompt(o.task, {event: rw.event}) : ""), event: rw.event}))];
  const inFolder = f => f && !f.includes("/") ? base + f : f;     // "x.mp4" → audio/real/<id>/x.mp4
  const vsrc = inFolder(rw.video) || `${base}${rw.id}_video.mp4`; addSrc(vsrc);
  const video = h("video",{src:vsrc, controls:true, playsinline:true, preload:"metadata", poster:rw.poster||null}); video.muted = true;
  const vmsg = h("div",{class:"msg",hidden:true});
  video.addEventListener("error", () => { vmsg.hidden=false; vmsg.textContent = "video pending — " + shortPath(vsrc); });

  const engine = new Engine();
  const view = new TracksView(engine, video, slots, pick); engine.view = view;
  engine.setSlots(slots.map(s => ({key:s.key, src:s.src})));
  let syncing = false;
  const start = async () => { if (video.paused || syncing) return; syncing = true;
    engine.stopNodes(); engine.playing = false; engine.offset = video.currentTime; await engine.play(); syncing = false; view.render(); };
  video.addEventListener("play", start); video.addEventListener("playing", start);
  ["pause","waiting","seeking","ended"].forEach(ev => video.addEventListener(ev, () => { engine.halt(); view.render(); }));
  video.addEventListener("seeked", () => { if (!video.paused) start(); view.render(); });
  video.addEventListener("timeupdate", () => { view.render();
    if (engine.playing && Math.abs(engine.pos() - video.currentTime) > 0.12) start(); });
  video.addEventListener("volumechange", () => { if (!video.muted) video.muted = true; });   // audio comes from the tracks
  engine.pause  = () => { engine.halt(); if (!video.paused) video.pause(); };                  // another sample took over
  engine.toggle = () => video.paused ? video.play() : video.pause();
  engine.onkey  = key => pick(key, false);

  // play button on a row: start that version, pause if it is already the one playing
  function pick(key, fromButton){
    if (!key) return; Engine.last = engine;
    if (fromButton && key===engine.active && !video.paused){ video.pause(); return; }
    engine.select(key); view.render();
    if (fromButton && video.paused) video.play();
  }
  const vbox = h("div",{class:"vbox"}, video, vmsg);
  vbox.addEventListener("pointerdown", () => Engine.last = engine);
  view.el._eng = engine; lazy.observe(view.el);
  return h("article",{class:"rw", id:"rw-"+rw.id},
    h("div",{class:"rw-title"}, h("h3",{}, rw.title||rw.id), rw.source ? h("p",{class:"src"}, rw.source) : null), vbox, view.el);
}

const EL_DESC = {
  M:"the talker the recording is about",
  I:"a second, more distant talker",
  N:"ambience that spans the whole recording",
  E:"a short sound, such as a door slam",
  R:"the room's reflections on every source",
};
function guideSection(){
  return h("section",{class:"guide", id:"guide"}, h("div",{class:"wrap"},
    h("h2",{},"How to listen"),
    h("div",{class:"box"},
      h("div",{class:"pane"}, h("h3",{},"Elements of a speaking scene"),
        h("ul",{}, ELS.map(e => h("li",{style:cvars(e)}, h("i",{class:"dotc"}), h("span",{}, h("b",{}, EL_NAME[e]), " — ", EL_DESC[e]))))),
      h("div",{class:"pane"}, h("h3",{},"Using a sample"),
        h("ol",{},
          h("li",{}, h("span",{},"Choose elements under a sample. The prompt is rebuilt from your choice, and the output changes with it.")),
          h("li",{}, h("span",{},"Press play on ", h("b",{},"Input"), DEMO.showTarget ? [", ", h("b",{},"Output"), " or ", h("b",{},"Target")] : [" or ", h("b",{},"Output")], ". Pressing another one while playing switches to it at the same time position.")),
          h("li",{}, h("span",{},"A dashed option is an element the recording does not contain. Choosing it is a ", h("b",{},"no-op"), ": the output should equal the input.")))))));
}

/* authors: array of {name, aff:[1,2], corr} (a plain string also works) */
function authorLine(M){
  if (!Array.isArray(M.authors)) return h("div",{class:"authors"}, M.authors||"");
  const mark = M.corrMark || "†";
  return h("div",{class:"authors"}, M.authors.flatMap((a,i) => [i ? ", " : null,
    h("span",{class:"au"}, a.name, h("sup",{}, (a.aff||[]).join(",") + (a.corr ? mark : "") + (a.sym||"")))]));
}
function affLine(M){
  const list = M.affiliations || (M.affiliation ? [M.affiliation] : []);
  const numbered = list.length > 1;
  return h("div",{class:"aff affs"}, list.map((af,i) => h("span",{class:"af"}, numbered ? h("sup",{}, String(i+1)) : null, af)));
}

function render(){
  const M = DEMO.meta, app = document.getElementById("app");
  const btns = h("div",{class:"btns"}, (M.links||[]).map(l => h("a",{href:l.href, target:l.href && l.href!=="#" ? "_blank" : null, rel:"noopener"},
    l.icon ? h("span",{class:"ic","aria-hidden":"true"}, l.icon) : null, l.label)));
  const header = h("header",{id:"top"}, h("div",{class:"wrap"},
    h("h1",{}, M.title), h("div",{class:"sub"}, M.subtitle),
    authorLine(M), affLine(M),
    M.footnotes ? h("div",{class:"notes"}, M.footnotes.map((f,i) => h("span",{class:"af"}, h("sup",{}, f.sym), " "+f.text))) : null,
    M.venue ? h("div",{class:"aff"}, M.venue) : null,
    btns, h("div",{class:"abstract"}, h("h2",{},"Abstract"), h("p",{}, M.intro),
      M.indexTerms ? h("p",{class:"terms"}, h("b",{},"Index Terms — "), M.indexTerms) : null)));

  const secs = [["guide","How to listen", guideSection()]];
  if (DEMO.hero && DEMO.hero.show) secs.push(["all21","21 prompts", heroSection()]);
  for (const op of OP_ORDER) if ((DEMO.sections[op]||[]).length) secs.push([op, OPS[op].label, opSection(op)]);
  if ((DEMO.realworld||[]).length) secs.push(["real","Real-world", h("section",{id:"real"}, h("div",{class:"wrap"},
    h("div",{class:"sec-head"}, h("h2",{},"Real-world recordings"),
      h("p",{class:"desc"},"In-the-wild clips with no reference target. The video is the same for every version; only the audio changes. Press play on a version to hear it in sync with the picture, and switch versions while it plays.")),
    DEMO.realworld.map(realBlock)))]);

  const nav = h("nav",{}, h("div",{class:"wrap"}, secs.map(([id,label]) => h("a",{href:"#"+id,"data-id":id}, label))));
  const footer = h("footer",{}, h("div",{class:"wrap"}, h("h3",{},"Citation"), h("pre",{class:"bib"}, M.bibtex||"")));
  app.append(header, nav, ...secs.map(s=>s[2]), footer);

  const as = [...nav.querySelectorAll("a")], bar = nav.firstChild;
  const spy = new IntersectionObserver(ents => ents.forEach(e => { if (!e.isIntersecting) return;
    as.forEach(a => a.classList.toggle("on", a.dataset.id===e.target.id));
    const a = as.find(a=>a.dataset.id===e.target.id); if (a) bar.scrollTo({left:a.offsetLeft - bar.clientWidth/2 + a.offsetWidth/2, behavior:"smooth"}); }),
    {rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(([id]) => spy.observe(document.getElementById(id)));

  if (new URLSearchParams(location.search).has("check")) runCheck();
}

/* ?check — lists every expected file for every selectable prompt of every sample */
async function runCheck(){
  for (const op of OP_ORDER) for (const sm of (DEMO.sections[op]||[])){
    const p = present(sceneOf(sm.scene));
    addSrc(sm.inputSrc || P.input(sm.scene));
    for (const [task,t] of Object.entries(TASKS)){
      if (t.op!==op || (sm.tasks && !sm.tasks.includes(task))) continue;
      if (op==="remove" && p.has("N") && p.has("E") && t.els.includes("N") && !t.els.includes("E")) continue;   // locked combos
      addSrc((sm.outputs||{})[task] || P.output(sm.scene, task));
      if (DEMO.showTarget && t.els.some(e => p.has(e))) addSrc((sm.targets||{})[task] || P.target(sm.scene, task));
    }
  }
  const box = h("div",{id:"check"}, "checking "+ALL_SRCS.size+" files…"); document.body.append(box);
  const missing = [];
  await Promise.all([...ALL_SRCS].map(async s => { try{ const r = await fetch(s,{method:"HEAD"}); if (!r.ok) missing.push(s); }catch(e){ missing.push(s); } }));
  missing.sort();
  box.replaceChildren(h("button",{style:"float:right;text-decoration:underline",onclick:()=>box.remove()},"close"),
    h("b",{}, `${ALL_SRCS.size-missing.length}/${ALL_SRCS.size} files found`), h("br"), ...missing.flatMap(m=>[m, h("br")]));
}

render();
